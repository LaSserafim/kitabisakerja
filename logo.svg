<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- 4-figure emblem -->
  <g transform="translate(30,30)">
    <!-- Top (Orange) -->
    <g>
      <circle cx="0" cy="-16" r="4.2" fill="#FF5E36"/>
      <path d="M -10 -9 C -4 -12, 4 -12, 10 -9 C 8 -4, 4 -2, 0 -2 C -4 -2, -8 -4, -10 -9 Z" fill="#FF6A3D"/>
    </g>
    <!-- Right (Yellow) -->
    <g transform="rotate(90)">
      <circle cx="0" cy="-16" r="4.2" fill="#FBBF24"/>
      <path d="M -10 -9 C -4 -12, 4 -12, 10 -9 C 8 -4, 4 -2, 0 -2 C -4 -2, -8 -4, -10 -9 Z" fill="#FBBF24"/>
    </g>
    <!-- Bottom (Blue) -->
    <g transform="rotate(180)">
      <circle cx="0" cy="-16" r="4.2" fill="#0284C7"/>
      <path d="M -10 -9 C -4 -12, 4 -12, 10 -9 C 8 -4, 4 -2, 0 -2 C -4 -2, -8 -4, -10 -9 Z" fill="#0284C7"/>
    </g>
    <!-- Left (Green) -->
    <g transform="rotate(270)">
      <circle cx="0" cy="-16" r="4.2" fill="#10B981"/>
      <path d="M -10 -9 C -4 -12, 4 -12, 10 -9 C 8 -4, 4 -2, 0 -2 C -4 -2, -8 -4, -10 -9 Z" fill="#10B981"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="68" y="38" font-family="-apple-system, BlinkMacSystemFont, Plus Jakarta Sans, sans-serif" font-size="24" font-weight="700" fill="#0284C7" letter-spacing="-0.5">Kitabisa</text>
  <!-- Yellow badge -->
  <rect x="160" y="19" width="70" height="26" rx="7" fill="#FDE047"/>
  <text x="195" y="37" font-family="-apple-system, BlinkMacSystemFont, Plus Jakarta Sans, sans-serif" font-size="14.5" font-weight="800" fill="#1E293B" text-anchor="middle" letter-spacing="-0.2">Kerja.id</text>
</svg>